on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check
permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
      - name: Verify installed vignette discovery
        shell: Rscript {0}
        run: |
          lib <- file.path("check", "breedtools.Rcheck")
          for (topic in c("breedtools", "getting-started")) {
            entry <- utils::vignette(topic, package = "breedtools", lib.loc = lib)
            stopifnot(inherits(entry, "vignette"))
          }
